<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Medicine Reminder System</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            width: 100%;
            box-sizing: border-box;
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #555;
            font-size: 13px;
            cursor: pointer;
            padding: 5px;
            width: auto;
            margin: 0;
        }
    </style>
</head>

<body>

<div class="login-container">
    <div class="login-box">

        <h2>MediReminder</h2>
        <p>Create Your Account</p>

        <form id="registerForm">

            <input
                type="text"
                id="fullName"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="tel"
                id="phone"
                placeholder="Phone Number"
                maxlength="10"
                pattern="[0-9]{10}"
                title="Enter exactly 10 digits"
                required
            >

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('password', this)"
                >Show</button>

            </div>

            <div class="password-container">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('confirmPassword', this)"
                >Show</button>

            </div>

            <button type="submit">Register</button>

        </form>

    </div>
</div>

<script>

function togglePassword(inputId, button) {

    const password = document.getElementById(inputId);

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
    } else {
        password.type = "password";
        button.textContent = "Show";
    }

}

document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // Name Validation
    if (!/^[A-Za-z ]+$/.test(name)) {
        alert("Invalid Name! Please enter letters only.");
        return;
    }

    // Phone Number Validation
    if (!/^[0-9]{10}$/.test(phone)) {
        alert("Invalid Phone Number! Enter exactly 10 digits.");
        return;
    }

    // Strong Password Validation
    const strongPassword = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$!%&*])[A-Za-z\d@#$!%&*]{8,}$/;

    if (!strongPassword.test(password)) {
        alert("Weak Password! Use at least 8 characters with uppercase, lowercase, number and special character.");
        return;
    }

    // Confirm Password Validation
    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    // Load Existing Users
    let users = [];

    try {
        users = JSON.parse(localStorage.getItem("users")) || [];
    } catch (error) {
        users = [];
    }

    // Migrate Previous Account
    const oldUser = localStorage.getItem("user");

    if (oldUser) {
        try {
            const previousUser = JSON.parse(oldUser);

            if (previousUser.email) {

                const exists = users.some(function(u) {
                    return u.email.toLowerCase() === previousUser.email.toLowerCase();
                });

                if (!exists) {
                    users.push(previousUser);
                }
            }
        } catch (error) {
            console.log("Previous user data could not be read.");
        }
    }

    // Check Duplicate Email
    const emailExists = users.some(function(u) {
        return u.email.toLowerCase() === email;
    });

    if (emailExists) {
        alert("This email is already registered! Please use another email.");
        return;
    }

    // Create New User
    const user = {
        name: name,
        email: email,
        phone: phone,
        password: password
    };

    // Save Users
    users.push(user);

    localStorage.setItem("users", JSON.stringify(users));

    alert("Registration Successful! Your account has been created.");

    window.location.href = "login.html";

});

</script>

</body>
</html>
