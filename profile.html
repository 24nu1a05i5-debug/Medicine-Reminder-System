<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Medicine Reminder System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h2 class="logo">💊 MediReminder</h2>

        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="add-medicine.html">Add Medicine</a></li>
            <li><a href="medicine.html">Medicines</a></li>
        </ul>
    </nav>
</header>

<div class="login-container">

    <div class="login-box">

        <h2>👤 User Profile</h2>

        <img src="https://via.placeholder.com/120"
             alt="Profile"
             class="profile-img">

        <h3 id="profileName"></h3>

<p><strong>Email:</strong> <span id="profileEmail"></span></p>

<p><strong>Phone:</strong> <span id="profilePhone"></span></p>

<button id="editProfile">Edit Profile</button>

<br><br>

<button id="logoutButton">Logout</button>
    <script>

const savedUser = localStorage.getItem("user");

if (savedUser) {

    const user = JSON.parse(savedUser);

    document.getElementById("profileName").textContent = user.name;
    document.getElementById("profileEmail").textContent = user.email;
    document.getElementById("profilePhone").textContent = user.phone;

} else {

    alert("Please login first.");
    window.location.href = "login.html";

}

document.getElementById("logoutButton").addEventListener("click", function() {

    localStorage.removeItem("loggedIn");

    alert("Logged out successfully!");

    window.location.href = "login.html";

});

document.getElementById("editProfile").addEventListener("click", function() {

    alert("Edit Profile feature will be added later.");

});

</script>

</body>
</html>
