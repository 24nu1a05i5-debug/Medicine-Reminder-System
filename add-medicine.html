<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medicine - Medicine Reminder System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <h2 class="logo">💊 MediReminder</h2>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="add-medicine.html">Add Medicine</a></li>
            <li><a href="medicine.html">Medicines</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>
    </nav>
</header>

<div class="login-container">
    <div class="login-box">

        <h2 id="formTitle">Add Medicine</h2>

        <form id="medicineForm">

            <input type="text" id="medicineName"
                   placeholder="Medicine Name" required>

            <input type="text" id="dosage"
                   placeholder="Dosage (e.g. 500 mg)" required>

            <input type="date" id="startDate" required>

            <input type="date" id="endDate" required>

            <input type="time" id="medicineTime" required>

            <select id="frequency" required>
                <option value="">Select Frequency</option>
                <option value="Once a Day">Once a Day</option>
                <option value="Twice a Day">Twice a Day</option>
                <option value="Three Times a Day">Three Times a Day</option>
            </select>

            <textarea id="notes"
                      placeholder="Notes (Optional)"
                      rows="4"></textarea>

            <button type="submit" id="saveButton">
                Save Medicine
            </button>

        </form>

    </div>
</div>

<script>

// Get Edit Index
const urlParams = new URLSearchParams(window.location.search);
const editIndex = urlParams.get("edit");

// Load Medicines
let medicines = JSON.parse(localStorage.getItem("medicines")) || [];

// Get today's date in YYYY-MM-DD format
function getTodayDate() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

// Set minimum date
const todayDate = getTodayDate();

document.getElementById("startDate").min = todayDate;
document.getElementById("endDate").min = todayDate;

// Edit Mode
if (editIndex !== null) {

    const index = parseInt(editIndex);

    if (Number.isInteger(index) && medicines[index]) {

        const medicine = medicines[index];

        document.getElementById("formTitle").textContent = "✏️ Edit Medicine";
        document.getElementById("saveButton").textContent = "Update Medicine";

        document.getElementById("medicineName").value = medicine.name;
        document.getElementById("dosage").value = medicine.dosage;
        document.getElementById("startDate").value = medicine.startDate;
        document.getElementById("endDate").value = medicine.endDate;
        document.getElementById("medicineTime").value = medicine.time;
        document.getElementById("frequency").value = medicine.frequency;
        document.getElementById("notes").value = medicine.notes || "";

    } else {
        alert("Invalid medicine record.");
        window.location.href = "medicine.html";
    }
}

// Update minimum end date when start date changes
document.getElementById("startDate").addEventListener("change", function() {

    const startDate = this.value;
    const endDateInput = document.getElementById("endDate");

    endDateInput.min = startDate > todayDate ? startDate : todayDate;

    if (endDateInput.value && endDateInput.value < endDateInput.min) {
        endDateInput.value = "";
    }
});

// Form Submit
document.getElementById("medicineForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("medicineName").value.trim();
    const dosage = document.getElementById("dosage").value.trim();
    const startDate = document.getElementById("startDate").value;
    const endDate = document.getElementById("endDate").value;
    const time = document.getElementById("medicineTime").value;
    const frequency = document.getElementById("frequency").value;
    const notes = document.getElementById("notes").value.trim();

    // Validate medicine name
    if (!name) {
        alert("Invalid Medicine Name!");
        return;
    }

    // Validate dosage
    if (!dosage) {
        alert("Please enter the dosage.");
        return;
    }

    // Validate previous dates
    if (startDate < todayDate || endDate < todayDate) {
        alert("Invalid Date! Please select today's date or a future date.");
        return;
    }

    // Validate start and end dates
    if (endDate < startDate) {
        alert("Invalid Date! End date cannot be before start date.");
        return;
    }

    // Create medicine object
    const medicine = {
        name: name,
        dosage: dosage,
        startDate: startDate,
        endDate: endDate,
        time: time,
        frequency: frequency,
        notes: notes
    };

    // Update Existing Medicine
    if (editIndex !== null) {

        const index = parseInt(editIndex);

        if (!Number.isInteger(index) || !medicines[index]) {
            alert("Invalid medicine record.");
            return;
        }

        medicines[index] = medicine;

        localStorage.setItem("medicines", JSON.stringify(medicines));

        alert("Medicine updated successfully!");

    } else {

        // Add New Medicine
        medicines.push(medicine);

        localStorage.setItem("medicines", JSON.stringify(medicines));

        alert("Medicine saved successfully!");
    }

    window.location.href = "medicine.html";

});

</script>

</body>
</html>
