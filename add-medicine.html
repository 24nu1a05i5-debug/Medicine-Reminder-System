<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Medicine - Medicine Reminder System</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<header>

    <nav class="navbar">

        <h2 class="logo">
            💊 MediReminder
        </h2>


        <ul class="nav-links">

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="add-medicine.html">
                    Add Medicine
                </a>
            </li>

            <li>
                <a href="medicine.html">
                    Medicines
                </a>
            </li>

            <li>
                <a href="profile.html">
                    Profile
                </a>
            </li>

        </ul>

    </nav>

</header>



<div class="login-container">


    <div class="login-box">


        <h2 id="formTitle">
            Add Medicine
        </h2>



        <form id="medicineForm">


            <!-- Medicine Name -->

            <input
                type="text"
                id="medicineName"
                placeholder="Medicine Name"
                required
            >



            <!-- Dosage -->

            <input
                type="text"
                id="dosage"
                placeholder="Dosage (e.g. 500 mg)"
                required
            >



            <!-- Start Date -->

            <input
                type="date"
                id="startDate"
                required
            >



            <!-- End Date -->

            <input
                type="date"
                id="endDate"
                required
            >



            <!-- Time -->

            <input
                type="time"
                id="medicineTime"
                required
            >



            <!-- Frequency -->

            <select
                id="frequency"
                required
            >

                <option value="">
                    Select Frequency
                </option>

                <option>
                    Once a Day
                </option>

                <option>
                    Twice a Day
                </option>

                <option>
                    Three Times a Day
                </option>

            </select>



            <!-- Notes -->

            <textarea
                id="notes"
                placeholder="Notes (Optional)"
                rows="4"
            ></textarea>



            <!-- Submit -->

            <button
                type="submit"
                id="saveButton"
            >

                Save Medicine

            </button>


        </form>


    </div>

</div>



<script>


/* =========================================
   GET EDIT INDEX
========================================= */


const urlParams =
    new URLSearchParams(
        window.location.search
    );


const editIndex =
    urlParams.get("edit");



/* =========================================
   LOAD MEDICINES
========================================= */


let medicines =
    JSON.parse(
        localStorage.getItem(
            "medicines"
        )
    ) || [];



/* =========================================
   EDIT MODE
========================================= */


if (editIndex !== null) {


    const index =
        parseInt(editIndex);



    if (
        medicines[index]
    ) {


        const medicine =
            medicines[index];



        /* Change heading */

        document.getElementById(
            "formTitle"
        ).textContent =
            "✏️ Edit Medicine";



        /* Change button */

        document.getElementById(
            "saveButton"
        ).textContent =
            "Update Medicine";



        /* Fill existing data */

        document.getElementById(
            "medicineName"
        ).value =
            medicine.name;



        document.getElementById(
            "dosage"
        ).value =
            medicine.dosage;



        document.getElementById(
            "startDate"
        ).value =
            medicine.startDate;



        document.getElementById(
            "endDate"
        ).value =
            medicine.endDate;



        document.getElementById(
            "medicineTime"
        ).value =
            medicine.time;



        document.getElementById(
            "frequency"
        ).value =
            medicine.frequency;



        document.getElementById(
            "notes"
        ).value =
            medicine.notes || "";

    }

}




/* =========================================
   FORM SUBMIT
========================================= */


document.getElementById(
    "medicineForm"
).addEventListener(
    "submit",
    function(event) {


        event.preventDefault();



        /* Get form values */

        const medicine = {


            name:
                document.getElementById(
                    "medicineName"
                ).value,


            dosage:
                document.getElementById(
                    "dosage"
                ).value,


            startDate:
                document.getElementById(
                    "startDate"
                ).value,


            endDate:
                document.getElementById(
                    "endDate"
                ).value,


            time:
                document.getElementById(
                    "medicineTime"
                ).value,


            frequency:
                document.getElementById(
                    "frequency"
                ).value,


            notes:
                document.getElementById(
                    "notes"
                ).value

        };



        /* =================================
           UPDATE EXISTING MEDICINE
        ================================= */


        if (editIndex !== null) {


            const index =
                parseInt(editIndex);



            medicines[index] =
                medicine;



            localStorage.setItem(

                "medicines",

                JSON.stringify(
                    medicines
                )

            );



            alert(
                "Medicine updated successfully!"
            );


        }



        /* =================================
           ADD NEW MEDICINE
        ================================= */


        else {


            medicines.push(
                medicine
            );



            localStorage.setItem(

                "medicines",

                JSON.stringify(
                    medicines
                )

            );



            alert(
                "Medicine saved successfully!"
            );

        }



        /* Go to medicine list */

        window.location.href =
            "medicine.html";


    }
);


</script>


</body>

</html>
