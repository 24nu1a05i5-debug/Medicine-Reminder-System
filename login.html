<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Medicine Reminder System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h2>💊 MediReminder</h2>
            <p>Login to your account</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">Login</button>

            </form>

        </div>

    </div>

    <script>

    document.getElementById("loginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        // Get entered details
        const email = document.getElementById("loginEmail").value.trim().toLowerCase();

        const password = document.getElementById("loginPassword").value;

        // Get all registered users
        let users = JSON.parse(localStorage.getItem("users")) || [];

        // Support an account created using the older registration code
        const oldUser = localStorage.getItem("user");

        if (oldUser) {

            try {

                const previousUser = JSON.parse(oldUser);

                if (previousUser.email) {

                    const alreadyExists = users.some(function(u) {
                        return u.email.toLowerCase() === previousUser.email.toLowerCase();
                    });

                    if (!alreadyExists) {
                        users.push(previousUser);
                        localStorage.setItem("users", JSON.stringify(users));
                    }

                }

            } catch (error) {
                console.log("Unable to read previous account.");
            }

        }

        // Check login credentials
        const user = users.find(function(u) {

            return u.email.toLowerCase() === email &&
                   u.password === password;

        });

        // Valid credentials
        if (user) {

            localStorage.setItem("loggedIn", "true");

            // Store current user's email
            localStorage.setItem("currentUser", user.email.toLowerCase());

            alert("Valid Credentials! Login Successful.");

            window.location.href = "dashboard.html";

        }

        // Invalid credentials
        else {

            alert("Invalid Credentials! Please check your email and password.");

        }

    });

    </script>

</body>
</html>
