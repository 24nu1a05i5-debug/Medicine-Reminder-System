<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Medicine Reminder System</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            width: 100%;
            box-sizing: border-box;
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #555;
            font-size: 13px;
            cursor: pointer;
            padding: 5px;
            width: auto;
            margin: 0;
        }
    </style>
</head>

<body>

<div class="login-container">
    <div class="login-box">

        <h2>MediReminder</h2>
        <p>Login to your account</p>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                required
            >

            <div class="password-container">

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('loginPassword', this)"
                >Show</button>

            </div>

            <button type="submit">Login</button>

        </form>

    </div>
</div>

<script>

function togglePassword(inputId, button) {

    const password = document.getElementById(inputId);

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
    } else {
        password.type = "password";
        button.textContent = "Show";
    }

}

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim().toLowerCase();

    const password = document.getElementById("loginPassword").value;

    let users = [];

    try {
        users = JSON.parse(localStorage.getItem("users")) || [];
    } catch (error) {
        users = [];
    }

    // Support previous single-user account
    const oldUser = localStorage.getItem("user");

    if (oldUser) {
        try {
            const previousUser = JSON.parse(oldUser);

            if (previousUser.email) {

                const exists = users.some(function(u) {
                    return u.email.toLowerCase() === previousUser.email.toLowerCase();
                });

                if (!exists) {
                    users.push(previousUser);
                    localStorage.setItem("users", JSON.stringify(users));
                }
            }
        } catch (error) {
            console.log("Unable to read previous account.");
        }
    }

    const user = users.find(function(u) {
        return u.email.toLowerCase() === email &&
               u.password === password;
    });

    if (user) {

        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("currentUser", user.email.toLowerCase());

        alert("Valid Credentials! Login Successful.");

        window.location.href = "dashboard.html";

    } else {

        alert("Invalid Credentials! Please check your email and password.");

    }

});

</script>

</body>
</html>
