```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Medicine Reminder System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">
    <div class="login-box">

        <h2>MediReminder</h2>
        <p>Login to your account</p>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                required
            >

            <!-- Password -->
            <div class="password-container">

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('loginPassword', this)"
                    aria-label="Show password"
                >
                    <svg class="eye-icon" viewBox="0 0 24 24">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>

            </div>

            <button type="submit">Login</button>

        </form>

    </div>
</div>

<script>

// Show / Hide Password
function togglePassword(inputId, button) {

    const password = document.getElementById(inputId);

    if (password.type === "password") {

        password.type = "text";

        button.innerHTML = `
            <svg class="eye-icon" viewBox="0 0 24 24">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3 3.8"/>
                <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.4 4-1"/>
            </svg>`;

        button.setAttribute("aria-label", "Hide password");

    } else {

        password.type = "password";

        button.innerHTML = `
            <svg class="eye-icon" viewBox="0 0 24 24">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>`;

        button.setAttribute("aria-label", "Show password");
    }
}


// Login Form
document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim().toLowerCase();

    const password = document.getElementById("loginPassword").value;


    // Load Existing Users
    let users = [];

    try {
        users = JSON.parse(localStorage.getItem("users")) || [];
    } catch (error) {
        users = [];
    }


    // Support Previous Single-User Account
    const oldUser = localStorage.getItem("user");

    if (oldUser) {
        try {
            const previousUser = JSON.parse(oldUser);

            if (previousUser.email) {

                const exists = users.some(function(u) {
                    return u.email.toLowerCase() === previousUser.email.toLowerCase();
                });

                if (!exists) {
                    users.push(previousUser);
                    localStorage.setItem("users", JSON.stringify(users));
                }
            }

        } catch (error) {
            console.log("Unable to read previous account.");
        }
    }


    // Check Login Credentials
    const user = users.find(function(u) {
        return u.email.toLowerCase() === email &&
               u.password === password;
    });


    if (user) {

        localStorage.setItem("loggedIn", "true");

        localStorage.setItem("currentUser", user.email.toLowerCase());

        alert("Valid Credentials! Login Successful.");

        window.location.href = "dashboard.html";

    } else {

        alert("Invalid Credentials! Please check your email and password.");

    }

});

</script>

</body>
</html>
