<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Medicine Reminder System</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .password-container {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .password-container input {
            width: 100%;
            box-sizing: border-box;
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            width: auto;
            margin: 0;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h2>💊 MediReminder</h2>
            <p>Login to your account</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email Address"
                    required
                >

                <div class="password-container">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>

                <button type="submit">Login</button>

            </form>

        </div>

    </div>

    <script>

    /* SHOW / HIDE PASSWORD */

    document.getElementById("togglePassword").addEventListener("click", function() {

        const password = document.getElementById("loginPassword");

        if (password.type === "password") {

            password.type = "text";
            this.textContent = "🙈";
            this.setAttribute("aria-label", "Hide password");

        } else {

            password.type = "password";
            this.textContent = "👁️";
            this.setAttribute("aria-label", "Show password");

        }

    });


    /* LOGIN VALIDATION */

    document.getElementById("loginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const email = document.getElementById("loginEmail").value.trim().toLowerCase();

        const password = document.getElementById("loginPassword").value;

        let users = JSON.parse(localStorage.getItem("users")) || [];

        const oldUser = localStorage.getItem("user");

        if (oldUser) {

            try {

                const previousUser = JSON.parse(oldUser);

                if (previousUser.email) {

                    const alreadyExists = users.some(function(u) {
                        return u.email.toLowerCase() === previousUser.email.toLowerCase();
                    });

                    if (!alreadyExists) {
                        users.push(previousUser);
                        localStorage.setItem("users", JSON.stringify(users));
                    }

                }

            } catch (error) {
                console.log("Unable to read previous account.");
            }

        }

        const user = users.find(function(u) {

            return u.email.toLowerCase() === email &&
                   u.password === password;

        });

        if (user) {

            localStorage.setItem("loggedIn", "true");

            localStorage.setItem("currentUser", user.email.toLowerCase());

            alert("Valid Credentials! Login Successful.");

            window.location.href = "dashboard.html";

        } else {

            alert("Invalid Credentials! Please check your email and password.");

        }

    });

    </script>

</body>
</html>
